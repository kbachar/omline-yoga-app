<div class="select-container">
  <select (change)="onSelectChange($event)">

    <option>Select {{selectName()}}</option>

    @for (option of options(); track option) {
    @if (inputValue() != option) {
    <option>{{option}}</option>
    }
    }

    @if (inputValue()) {
    <option selected>{{inputValue()}}</option>
    }

  </select>
</div>
