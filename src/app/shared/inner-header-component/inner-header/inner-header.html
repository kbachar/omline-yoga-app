<header class="classes-header">
  <nav class="classes-left-navbar">
    <div class="navbar-item" (click)="openPopup('about')">About</div>
    <div class="navbar-item" (click)="openPopup('contact')">Contact Us</div>
    <div class="navbar-item" (click)="openPopup('plans')">Plans</div>
  </nav>

  <img class="classes-header-img" src="/assets/images/yoga-classes-logo.png" alt="Yoga Classes Logo" (click)="goHome()">

  <nav class="navbar">
    @if (!isLoggedIn()) {
    <div class="navbar-item" (click)="login()">Login</div>
    }
    @if (isLoggedIn()) {
    <div class="navbar-item" (click)="logout()">logout</div>
    }
    <div class="navbar-dropdown">
      <div class="navbar-item">Subscribe</div>
      <div routerLink="/teacher-subscribe-page" class="sub-navbar-item">Teacher</div>
      <div class="sub-navbar-item">student</div>
    </div>
  </nav>
</header>

<app-login-component [isOpen]="isLoginModalOpen()" (closed)="closeLoginModal()"></app-login-component>

@if (showNavigationBar() == true) {
<div class="classes-navbar">
  @for (item of items; track item) {
  <div class="classes-navbar-item" [class.is-selected]="yogaStyleId() === item.id"
    (click)="classesNavbarClick(item.id)">
    {{ item.title }}
  </div>
  }
</div>
}


<router-outlet></router-outlet>
