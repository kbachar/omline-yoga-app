@if (classes(); as classes) {
<div class="yoga-classes">
  @for (classItem of classes; track classItem.id) {
  <div class="yoga-class-meta" [class.is-selected]="isClassSelected(classItem)" (click)="addSelectedClass(classItem)">
    <video class="yoga-class-img" [src]="classItem.videoLink"></video>

    <app-yoga-class [classData]="classItem" [descriptionWidth]="361" [descriptionHeight]="80" [showClassLength]="false"
      [showTeacherName]="showTeacherName()" [descriptionHeight]="descriptionHeight()"
      [showClassLength]="showClassLength()"></app-yoga-class>
    @if (showAddToList()) {
    <div class="buttons-container">
      <button>add to list</button>
      <button>class page</button>
    </div>
    }
  </div>
  }
</div>
}
