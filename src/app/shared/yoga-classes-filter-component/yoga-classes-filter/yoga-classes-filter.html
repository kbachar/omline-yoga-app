<div class="container">
    <div class="filter-text">{{filterName()}}</div>
    @for (filterOption of filterOptions(); track filterOption) {
    <app-check-box 
      [inputValue]="filterOption" 
      [disabled]="readOnly() == true"
      [checked]="isOptionSaved(filterOption)"
      (checkChange)="readOnly() == false ? onFilterChange(filterOption, $event) : null"
      >
    </app-check-box>
    }
</div>
