<div class="container">
    <div class="filter-text">{{filterName()}}</div>
    @for (filterOption of filterOptions(); track filterOption) {
    <app-check-box 
      [inputValue]="filterOption" 
      [checked]="savedOption() == filterOption"
      (checkChange)="onFilterChange(filterOption)"
      >
    </app-check-box>
    }
</div>
