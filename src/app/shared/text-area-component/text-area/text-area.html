<div class="container" [style.background]="backgroundColor()">
    @if (showLogo()) {
    <div class="logo">
        <img src="/assets/images/yoga-classes-logo.png">
    </div>
    }
    <textarea [readOnly]="readOnly()" [style.height.px]="textHeight() ?? null" [style.width.px]="textWidth() ?? null"
        [style.color]="textColor() ?? null" [value]="textValue()" [placeholder]="textAreaName() ?? ''"
        [style.background]="backgroundColor()" (input)="onInput($event)" required></textarea>
    @if (image()) {
    <div class="image">
        <img [src]="image() ?? ''">
    </div>
    }
</div>
