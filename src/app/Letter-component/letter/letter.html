<app-page-header [headerText]="'letters - new letter'" [buttonText]="'save'" [showBack]="true"></app-page-header>
<div class="container">

    @if (letter$ | async; as letter) {
    <app-toggle-setting [labelText]="'Show Logo'" (switchStateChange)="showLogo($event)"></app-toggle-setting>

    <app-text-box [placeholderValue]="'enter title'" (textChange)="updatePreview($event)"
        [inputValue]="letter.title"></app-text-box>

    <div class="logo">
        <img src="{{logo}}">
    </div>

    <app-text-area [textAreaName]="'Write your letter...'" [textWidth]="750" [textHeight]="600"
        [textValue]="letter.content" (textValueChange)="updatePreview($event)"></app-text-area>

    }

</div>
