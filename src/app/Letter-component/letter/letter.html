@if (letter$ | async; as letter) {
<app-page-header [headerText]="'letters - ' + letter.title" [buttonText]="'save'" [showBack]="true"
    [headerTextHeight]="30" (backToListClick)="backToLetters()" (buttonClick)="saveLetter(letter)"></app-page-header>

<div class="container">
    <div class="left-side">

        <app-toggle-setting [labelText]="'Show Logo'" (switchStateChange)="showLogo($event)"
            [switchState]="letter.showLogo"></app-toggle-setting>
        @if (images$ | async; as images) {
        <app-select-list [inputValue]="letter.image" [options]="images"
            (selectedOption)="OnSelectedOption($event, letter)"></app-select-list>
        <label>send to: {{ recipients.map(recipient => recipient.email).join('; ')}}</label>

        <app-text-box [placeholderValue]="'enter title'" (textChange)="titleChanged(letter,$event)"
            [inputValue]="letter.title" [textBoxWidth]="750"></app-text-box>

        <div class="email-preview">
            <app-text-area #emailPreview [textAreaName]="'Write your letter...'" [textHeight]="600"
                [textValue]="letter.content" (textValueChange)="contentChanged(letter, $event)" [showLogo]="true"
                [image]="image$ | async" [textWidth]="756"></app-text-area>
        </div>
        }
    </div>

    <div class="right-side">
        <button (click)="sendLetter(letter)" [disabled]="recipients.length === 0">Send letter</button>

        <app-radio-group [radioNames]="['teachers', 'invited teachers', 'invited links']" [selectedRadio]="'teachers'"
            (selectedOptionChange)="radioChanged($event)"></app-radio-group>

        <label>sent to</label>
        @for (recipient of letter.sentTo; track recipient) {
        <div class="sent-to">
            <label class="small-label">{{recipient.name}} - {{recipient.date | date:'dd/MM/yy'}}</label>
        </div>
        }
    </div>
    <div class="recipients">
        <label>select recipients</label>
        @if (recipientsNamesAndIds$ | async) {
        @for (recipient of recipientsNamesAndIds$ | async; track recipient) {
        <app-check-box [inputValue]="recipient.name"
            (checkChange)="addTeacher($event, recipient, letter)"></app-check-box>
        }}
    </div>
</div>
}
