<app-main-header></app-main-header>
<app-classes-navbar [yogaStyleId]="yogaStyleId()"></app-classes-navbar>

<div class="container">
    <header>
        <img [src]="isBackHovered ? '/assets/images/back-hover.png' : '/assets/images/back.png'" (click)="back()"
            (mouseenter)="isBackHovered = true" (mouseleave)="isBackHovered = false" alt="Back">
        <div class="my-selected-classes-container">
            <div class="my-selected-classes">my</div>
            <div class="my-selected-classes-bold">selected</div>
            <div class="my-selected-classes">classes</div>
        </div>
    </header>
    <div class="classes-container">
        @for (yogaClass of classes$ | async; track yogaClass) {
        <div class="class-container">
            <video [src]="yogaClass.videoLink"></video>
            <div class="inner-class-container">
                <label class="teacher-name">{{yogaClass.teacherName}}</label>
                <app-yoga-class [classData]="yogaClass" [descriptionWidth]="300" [showClassLength]="true"></app-yoga-class>
            </div>
        </div>
        }
    </div>
    <div class="suggested-classes-continer">
        <div class="suggested-classes">
        </div>
    </div>
</div>
