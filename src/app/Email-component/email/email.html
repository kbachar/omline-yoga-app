@if (email$ | async; as email) {
<app-page-header [headerText]="'emails - ' + email.title" [showBack]="true" [headerTextHeight]="30"
    [showButton]="!email.from.includes('@yoga-om-line.com')" [buttonText]="'reply'" (buttonClick)="reply(email)"
    (backToListClick)="backToEmails()"></app-page-header>

<div class="container">
    <div class="left-side">
        <label>From: {{email.from}}</label>
        <label>To: {{ email.recipients.map(recipient => recipient).join('; ')}}</label>
        <app-text-box [inputValue]="email.title" [readonly]="true" [textBoxWidth]="750"
            (textChange)="contentChanged(email, $event)"></app-text-box>
        <app-text-area [textAreaName]="'Email content'" [textWidth]="750" [textHeight]="600"
            [textValue]="email.content" (textValueChange)="contentChanged(email, $event)"></app-text-area>
    </div>
</div>
}
