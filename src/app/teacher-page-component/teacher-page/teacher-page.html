@if (teacher$ | async; as teacher) {
<app-main-header></app-main-header>
<app-classes-navbar></app-classes-navbar>
<div class="container">
    <div class="teacher-container">
        <header>
            <div class="back-container" (click)="back()">
                <img [src]="'/assets/images/back.png'">
                <label>back</label>
            </div>
        </header>
        <div class="header-container">
            <header>meet</header>
            <header class="bold">{{teacher.fullName}}</header>
        </div>
        <div class="header-container">
            <img src="{{teacher.photo}}">
            <label>{{teacher.description}}</label>
        </div>
        <div class="filters-container">
            <app-main-filter (selectedFilters)="onFilterChange($event)" [width]="1197"></app-main-filter>
        </div>
        @if (classes$ | async; as classes) {
        <app-classes-display [classes]="classes" [showTeacherName]="false" [showAddToList]="false" [backPage]="teacher.teacherID"
        [descriptionHeight]="160" [showClassLength]="true"></app-classes-display>
        }

    </div>
</div>
}
