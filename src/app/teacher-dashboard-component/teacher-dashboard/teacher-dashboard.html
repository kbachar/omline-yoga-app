@if (status$ | async; as status) {
<header>
    <img src="/assets/images/dashboard-logo.png" (click)="home()">
    <div class="back-container">
        <div class="back"> Back to site</div>
    </div>
</header>
<div class="dashboard-layout">
    <div class="side-bar">
        <div class="side-bar-item" routerLink="/teacher-dashboard" routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }">Home</div>
        <div class="side-bar-item" [routerLink]="['teacher-profile', uid$]" routerLinkActive="active">my profile
        </div>
        <div class="side-bar-item" [class.side-bar-item-disabled]="status == 'subscribed'"
            [routerLink]=" ['teacher-classes', uid$]" routerLinkActive="active">my classes</div>
        <div class="side-bar-item" [class.side-bar-item-disabled]="status == 'subscribed'"
            [routerLink]="['yoga-class-details', '']" routerLinkActive="active">upload class</div>
        <div class="side-bar-item" [class.side-bar-item-disabled]="status == 'subscribed'">views info</div>
        <div class="side-bar-item" [class.side-bar-item-disabled]="status == 'subscribed'">Payments</div>
        <div class="side-bar-item" (click)="logout()">Logout</div>
    </div>
    <div class="body">
        <main class="content">
            <router-outlet></router-outlet>
        </main>
    </div>

</div>
}
