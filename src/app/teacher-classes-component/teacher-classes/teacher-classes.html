<div class="container">
    <app-page-header [headerText]="'my classes'" [buttonText]="'+ add class'"
        (buttonClick)="addClass()"></app-page-header>
    <div class="classes-container">
        @if (classes$ | async; as classes) {
        @for (yogaClass of classes; track yogaClass.id) {
        <div class="class-container">
            <video [src]="yogaClass.videoLink"></video>
            <div class="class-description-container">
                <app-yoga-class [classData]="yogaClass" [descriptionWidth]="1050" [descriptionHeight]="140"
                    [showViewEdit]="true" (viewEditClick)="editClass(yogaClass)"></app-yoga-class>
            </div>
        </div>
        }}
    </div>
</div>
