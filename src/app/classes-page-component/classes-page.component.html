@if (yogaStyle$ | async; as yogaStyle) {
<app-main-header></app-main-header>
<app-classes-navbar [yogaStyleId]="yogaStyle.id"
  (onClassesNavbarClick)="classesNavbarClick($event)"></app-classes-navbar>
<app-header-page-component [page]="yogaStyle.id" [suffix]="'yoga classes'"></app-header-page-component>

<section class="classes-page">
  <main class="classes-main" [style.background-color]="yogaStyle.classesBodyBackgroundColor">
    <div class="main-container">
      <div class="filters-container">
        <app-main-filter (selectedFilters)="onFilterChange($event)"></app-main-filter>
      </div>

      <div class="main-classes-container">
        <img class="arrow-left" src="/assets/images/arrow-left.png">
        <div class="selected-classes-container">
          @if (selectedClasses().length === 0) {
          <div class="selected-class-small">
            <div class="selected-class-caption">Select a class</div>
          </div>
          }

          @for (selectedClass of selectedClasses(); track selectedClass.id) {
          <div class="selected-class-small">
            <video [src]="selectedClass.videoLink"></video>
            <div class="selected-class-caption">{{ selectedClass.title }}</div>
          </div>
          }
          <div class="show-on-page-container" (click)="selectedClassesClick(selectedClasses())"
            (mouseenter)="isShowOnPageHovered = true" (mouseleave)="isShowOnPageHovered = false">
            <img
              [src]="isShowOnPageHovered ? '/assets/images/show-on-page-hover.png' : '/assets/images/show-on-page.png'">
          </div>
          <div class="selected-classes-clear" (click)="clearSelectedClasses()">X clear</div>
        </div>
        <img class="arrow-right" src="/assets/images/arrow-right.png">
      </div>

      @if (classes$ | async; as classes) {
      <app-classes-display [classes]="classes"></app-classes-display>
      }
      <!-- @if (classes$ | async; as classes) {
      <div class="yoga-classes">
        @for (classItem of classes; track classItem.id) {
        <div class="yoga-class-meta" [class.is-selected]="isClassSelected(classItem)"
          (click)="addSelectedClass(classItem)">
          <video class="yoga-class-img" [src]="classItem.videoLink"></video>

          <div class="class-header-row">
            <div class="teacher-name">{{ classItem.teacherName}}</div>
            <div class="yoga-class-time">{{classItem.classLength}}</div>
          </div>
          <app-yoga-class [classData]="classItem" [descriptionWidth]="361" [descriptionHeight]="80"
            [showClassLength]="false"></app-yoga-class>
            <button>add to list</button>
        </div>
        }
      </div>
      } -->
    </div>

  </main>
</section>
}
